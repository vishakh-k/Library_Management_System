# ==============================================================================
# docker-compose.prod.yml – Library Management System Production Stack
# Services: Flask/Gunicorn web app (from AWS ECR), MySQL 8.0, Nginx reverse proxy
# ==============================================================================

version: "3.9"

services:
  # ---------------------------------------------------------------------------
  # Flask application pulled from AWS ECR
  # ---------------------------------------------------------------------------
  web:
    image: ${ECR_REGISTRY}/${DOCKER_IMAGE}:${DOCKER_TAG}
    container_name: lms-web
    ports:
      - "5000:5000"
    environment:
      - MYSQL_HOST=db
      - MYSQL_PORT=3306
      - MYSQL_USER=${MYSQL_USER:-lms_user}
      - MYSQL_PASSWORD=${MYSQL_PASSWORD:-lms_password}
      - MYSQL_DB=${MYSQL_DATABASE:-library_db}
      - FLASK_ENV=production
    depends_on:
      db:
        condition: service_healthy
    volumes:
      - ./static:/app/static
    restart: always
    networks:
      - library-net
    deploy:
      resources:
        limits:
          memory: 512M
          cpus: "1.0"

  # ---------------------------------------------------------------------------
  # MySQL 8.0 database
  # ---------------------------------------------------------------------------
  db:
    image: mysql:8.0
    container_name: lms-db
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-rootpassword}
      MYSQL_DATABASE: library_db
      MYSQL_USER: ${MYSQL_USER:-lms_user}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:-lms_password}
    ports:
      - "3306:3306"
    volumes:
      - mysql_data:/var/lib/mysql
      - ./database/schema.sql:/docker-entrypoint-initdb.d/01-schema.sql:ro
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "root", "-p${MYSQL_ROOT_PASSWORD:-rootpassword}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s
    restart: always
    networks:
      - library-net
    command: >
      --default-authentication-plugin=mysql_native_password
      --character-set-server=utf8mb4
      --collation-server=utf8mb4_unicode_ci
    deploy:
      resources:
        limits:
          memory: 1G
          cpus: "1.0"

  # ---------------------------------------------------------------------------
  # Nginx reverse proxy
  # ---------------------------------------------------------------------------
  nginx:
    image: nginx:alpine
    container_name: lms-nginx
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./deployment/nginx.conf:/etc/nginx/conf.d/default.conf:ro
      - ./static:/app/static:ro
    depends_on:
      - web
    restart: always
    networks:
      - library-net
    deploy:
      resources:
        limits:
          memory: 128M
          cpus: "0.5"

# =============================================================================
# Persistent volumes
# =============================================================================
volumes:
  mysql_data:
    driver: local

# =============================================================================
# Networks
# =============================================================================
networks:
  library-net:
    driver: bridge
