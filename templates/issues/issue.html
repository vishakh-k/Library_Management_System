{% extends "base.html" %}

{% block title %}Issue Book{% endblock %}
{% block page_title %}Issue Book{% endblock %}

{% block content %}
<div class="row justify-content-center animate-fade-in">
  <div class="col-lg-6 col-md-8">
    <div class="card shadow-sm border-0" style="border-radius: 12px;">
      <div class="card-header bg-transparent border-0 pt-4 pb-0 px-4 d-flex align-items-center">
        <h5 class="mb-0 fw-700">
          <i class="fas fa-exchange-alt me-2 text-accent"></i>
          New Transaction
        </h5>
      </div>
      
      <div class="card-body p-4">
        <form method="POST" action="{{ url_for('issues.issue_book') }}">
          <input type="hidden" name="csrf_token" value="{{ csrf_token() if csrf_token is defined else '' }}">
          
          <!-- Book Selection -->
          <div class="mb-3">
            <label for="book_id" class="form-label fw-600">Select Book <span class="text-danger">*</span></label>
            <select class="form-select" id="book_id" name="book_id" required>
              <option value="" disabled selected>Choose a book...</option>
              {% for book in books %}
                <option value="{{ book.id }}">{{ book.title }} by {{ book.author }} ({{ book.available }} available)</option>
              {% endfor %}
            </select>
          </div>

          <!-- Student Selection -->
          <div class="mb-4">
            <label for="student_id" class="form-label fw-600">Select Student <span class="text-danger">*</span></label>
            <select class="form-select" id="student_id" name="student_id" required>
              <option value="" disabled selected>Choose a student...</option>
              {% for student in students %}
                <option value="{{ student.id }}">{{ student.name }} (Enrollment: {{ student.enrollment_no }})</option>
              {% endfor %}
            </select>
          </div>

          <!-- Buttons -->
          <div class="d-flex justify-content-end gap-12 mt-4">
            <a href="{{ url_for('issues.list_issues') }}" class="btn btn-light">Cancel</a>
            <button type="submit" class="btn btn-primary-gradient">
              <i class="fas fa-check me-1"></i> Confirm Issue
            </button>
          </div>
        </form>
      </div>
    </div>
  </div>
</div>
{% endblock %}
