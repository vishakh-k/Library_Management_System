<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>500 - Internal Server Error</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700;800&display=swap" rel="stylesheet">
  <style>
    body {
      background: radial-gradient(circle at center, #1e293b, #0f172a);
      color: #f8fafc;
      font-family: 'Inter', sans-serif;
      height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
    }
    .error-card {
      text-align: center;
      padding: 3rem;
      border-radius: 16px;
      background: rgba(30, 41, 59, 0.7);
      backdrop-filter: blur(12px);
      border: 1px solid rgba(255, 255, 255, 0.05);
      box-shadow: 0 10px 30px rgba(0, 0, 0, 0.3);
      max-width: 480px;
    }
    .error-code {
      font-size: 6rem;
      font-weight: 800;
      background: linear-gradient(135deg, #ef4444, #f87171);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      margin-bottom: 0.5rem;
    }
    .btn-home {
      background: linear-gradient(135deg, #ef4444, #f87171);
      color: white;
      border: none;
      padding: 0.75rem 2rem;
      border-radius: 8px;
      font-weight: 600;
      transition: all 0.3s ease;
      text-decoration: none;
      display: inline-block;
      margin-top: 1.5rem;
    }
    .btn-home:hover {
      opacity: 0.9;
      transform: translateY(-2px);
      color: white;
    }
  </style>
</head>
<body>
  <div class="error-card">
    <div class="error-code">500</div>
    <h3 class="fw-700 mb-3">Internal Server Error</h3>
    <p class="text-secondary mb-4">
      Something went wrong on our servers. We are working to resolve the issue as quickly as possible. Please try again later.
    </p>
    <a href="/" class="btn-home">Go to Dashboard</a>
  </div>
</body>
</html>
