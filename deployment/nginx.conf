# ==============================================================================
# nginx.conf – Library Management System
# Reverse proxy → Gunicorn (web:5000), static file serving, security headers
# ==============================================================================

# Upstream definition for the Flask/Gunicorn backend
upstream flask_app {
    server web:5000;
    # Add more servers here for load balancing:
    # server web2:5000;
}

# ---------------------------------------------------------------------------
# HTTP server – port 80
# ---------------------------------------------------------------------------
server {
    listen 80;
    listen [::]:80;
    server_name _;  # Replace with your_domain.com in production

    # Max upload size (e.g. book cover images, reports)
    client_max_body_size 10M;

    # -----------------------------------------------------------------------
    # Security headers
    # -----------------------------------------------------------------------
    add_header X-Frame-Options            "SAMEORIGIN"       always;
    add_header X-Content-Type-Options     "nosniff"          always;
    add_header X-XSS-Protection           "1; mode=block"    always;
    add_header Referrer-Policy             "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy          "camera=(), microphone=(), geolocation=()" always;
    # Uncomment after enabling HTTPS:
    # add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;

    # -----------------------------------------------------------------------
    # Gzip compression
    # -----------------------------------------------------------------------
    gzip              on;
    gzip_vary         on;
    gzip_proxied      any;
    gzip_comp_level   6;
    gzip_min_length   256;
    gzip_types
        text/plain
        text/css
        text/javascript
        application/javascript
        application/json
        application/xml
        application/xml+rss
        image/svg+xml
        font/woff
        font/woff2;

    # -----------------------------------------------------------------------
    # Static files – served directly by Nginx (bypass Gunicorn)
    # -----------------------------------------------------------------------
    location /static/ {
        alias /app/static/;
        expires 30d;
        add_header Cache-Control "public, immutable";
        access_log off;
    }

    # Favicon shortcut
    location = /favicon.ico {
        alias /app/static/favicon.ico;
        access_log off;
        log_not_found off;
    }

    # -----------------------------------------------------------------------
    # Proxy all other requests to the Flask app
    # -----------------------------------------------------------------------
    location / {
        proxy_pass http://flask_app;

        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # Timeouts
        proxy_connect_timeout 60s;
        proxy_send_timeout    60s;
        proxy_read_timeout    60s;

        # Buffer settings
        proxy_buffering       on;
        proxy_buffer_size     128k;
        proxy_buffers         4 256k;
        proxy_busy_buffers_size 256k;
    }

    # -----------------------------------------------------------------------
    # Deny access to hidden files (.env, .git, etc.)
    # -----------------------------------------------------------------------
    location ~ /\. {
        deny all;
        access_log off;
        log_not_found off;
    }

    # Custom error pages (optional – add your own templates)
    error_page 502 503 504 /50x.html;
    location = /50x.html {
        root /usr/share/nginx/html;
        internal;
    }
}

